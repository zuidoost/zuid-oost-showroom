<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3600"><title>Zuid-Oost Showroom</title>
<style>
  
.reclame-foto {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.ad-right {
    background-image: url("reclame TV saa (2).png") !important;
    background-size: contain !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

.ad-right .ad-title,
.ad-right .ad-sub {
    display: none !important;
}
  background-image: url("reclame%20TV%20saa%20%282%29.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}
.ad-right .ad-title,
.ad-right .ad-sub {

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#f4f8ff;background:#08182e}body{padding:1.5vh 1.5vw}.screen{height:97vh;display:grid;grid-template-rows:9% minmax(0,1fr) 8%;gap:1.5vh}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #2196f3;min-height:0}.brand{font-size:clamp(20px,2.6vw,46px);font-weight:800;white-space:nowrap}.brand span{color:#33b4ff}.clock{font-size:clamp(22px,2.5vw,44px);font-weight:700}.content{min-height:0;display:grid;grid-template-columns:55% minmax(0,1fr);gap:1.5vw}.panel{background:linear-gradient(135deg,#123963,#0750a5);border-radius:14px;padding:2vh 1.6vw;min-height:0;overflow:hidden}.panel h2{font-size:clamp(18px,2vw,32px);margin:0 0 1.4vh}.news-list{height:calc(100% - 5vh);overflow:hidden;display:flex;flex-direction:column;justify-content:space-around}.news-item{font-size:clamp(15px,1.65vw,27px);line-height:1.25;padding:1.2vh 0;border-bottom:1px solid #6a9bcc}.right{display:grid;grid-template-rows:45% minmax(0,1fr);gap:1.5vh;min-height:0}.weather{text-align:center}.temp{font-size:clamp(48px,6vw,95px);font-weight:bold;line-height:1.1}.condition{font-size:clamp(17px,1.8vw,29px)}.details{font-size:clamp(12px,1.3vw,20px);margin-top:1.2vh}.small{font-size:clamp(11px,.9vw,15px);opacity:.85;margin-top:1vh}.ad{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,#0860ba,#05316c)}.ad-title{font-size:clamp(20px,2.6vw,42px);font-weight:800}.ad-sub{font-size:clamp(14px,1.5vw,25px);margin-top:1.5vh}.footer{border-radius:12px;background:#0753a6;display:flex;align-items:center;justify-content:space-between;padding:0 1.4vw;font-size:clamp(14px,1.5vw,24px);min-height:0}.footer small{font-size:clamp(11px,1vw,16px)}@media(max-width:650px){.brand{font-size:17px}.content{grid-template-columns:52% 1fr}.panel{padding:1.4vh 1.4vw}.news-item{font-size:13px}.panel h2{font-size:16px}.ad-title{font-size:16px}.ad-sub{font-size:12px}.details{font-size:11px}}
</style></head><body><main class="screen"><header class="top"><div class="brand"><span>ZUID-OOST</span> AUTOMOBIELBEDRIJF</div><div class="clock" id="clock">--:--</div></header><section class="content"><article class="panel"><h2>📰 Nieuws</h2><div class="news-list" id="news"><div class="news-item">Nieuws wordt geladen…</div></div></article><div class="right"><section class="panel weather"><h2>🌤️ Het weer in Tilburg</h2><div class="temp" id="temp">--°</div><div class="condition" id="condition">Weer wordt geladen…</div><div class="details" id="details"></div><div class="small" id="updated"></div></section><section class="panel ad"><div class="ad-title" id="ad-title">Welkom bij Zuid-Oost</div><div class="ad-sub" id="ad-sub">Uw auto verdient onze aandacht.</div></section></div></section><footer class="footer"><div>Welkom bij Zuid-Oost Automobielbedrijf</div><small>🚘 ZUID-OOST</small></footer></main>
<script>
function clock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit'}).format(new Date())}clock();setInterval(clock,30000);
const ads=[['VOLVO SPECIALIST','Onderhoud en service met aandacht voor uw Volvo'],['APK & ONDERHOUD','Vakkundige controle en onderhoud van uw auto'],['BANDEN & VELGEN','Vraag naar de mogelijkheden voor uw auto'],['ZUID-OOST AUTOMOBIELBEDRIJF','Uw auto verdient onze aandacht']];let adIndex=0;function showAd(){const a=ads[adIndex++%ads.length];document.getElementById('ad-title').textContent=a[0];document.getElementById('ad-sub').textContent=a[1]}showAd();setInterval(showAd,12000);
const weatherNames={0:'Helder',1:'Overwegend helder',2:'Half bewolkt',3:'Bewolkt',45:'Mist',48:'Mist',51:'Lichte motregen',53:'Motregen',55:'Motregen',61:'Lichte regen',63:'Regen',65:'Zware regen',71:'Lichte sneeuw',73:'Sneeuw',75:'Zware sneeuw',80:'Regenbuien',81:'Regenbuien',82:'Zware buien',95:'Onweer'};
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=51.5555&longitude=5.09138&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Europe%2FAmsterdam');if(!r.ok)throw Error('weer');const w=(await r.json()).current;document.getElementById('temp').textContent=Math.round(w.temperature_2m)+'°';document.getElementById('condition').textContent=weatherNames[w.weather_code]||'Actueel weer';document.getElementById('details').textContent='Gevoelstemperatuur '+Math.round(w.apparent_temperature)+'° · Wind '+Math.round(w.wind_speed_10m)+' km/u · Vochtigheid '+w.relative_humidity_2m+'%';document.getElementById('updated').textContent='Bijgewerkt: '+w.time.slice(11,16)+' · Open-Meteo'}catch(e){document.getElementById('condition').textContent='Weer tijdelijk niet beschikbaar'}}weather();setInterval(weather,600000);
async function news(){const el=document.getElementById('news');try{const feed='https://feeds.nos.nl/nosnieuwsalgemeen';const url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);const r=await fetch(url);if(!r.ok)throw Error('nieuws');const d=await r.json();if(!d.items||!d.items.length)throw Error('leeg');el.innerHTML='';d.items.slice(0,5).forEach(item=>{const div=document.createElement('div');div.className='news-item';div.textContent=item.title;el.appendChild(div)})}catch(e){el.textContent='Nieuws tijdelijk niet beschikbaar'}}news();setInterval(news,600000);
</script></body></html>
