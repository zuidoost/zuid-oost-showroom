<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3600"><title>Zuid-Oost Showroom</title><style>
*{box-sizing:border-box}body{margin:0;background:#07182b;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{min-height:100vh;padding:3vw;display:grid;grid-template-columns:1.5fr 1fr;grid-template-rows:auto 1fr auto;gap:2vw}header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #1683c9;padding-bottom:1.5vw}h1{font-size:3.5vw;margin:0;color:#62b9f5}#clock{font-size:3vw;font-weight:bold}.panel{background:#102c49;border-radius:18px;padding:2.3vw}h2{font-size:2.5vw;margin:0 0 1.5vw;color:#87d1ff}.news{font-size:2vw;line-height:1.35}.story{padding:1.1vw 0;border-bottom:1px solid #3b5973}.story small{display:block;color:#b9d0df;font-size:1.1vw;margin-top:.5vw}.weather{text-align:center}.temp{font-size:6vw;font-weight:bold}.condition{font-size:2vw}.details{font-size:1.6vw;margin-top:1.5vw}footer{grid-column:1/-1;background:#075b9a;border-radius:18px;padding:2vw;display:flex;align-items:center;justify-content:space-between}.ad{font-size:2.7vw;font-weight:bold}.sub{font-size:1.6vw;margin-top:.6vw}.tag{font-size:2vw;color:#fff}.status{font-size:1.1vw;color:#b9d0df;margin-top:1.3vw}@media(max-width:650px){.wrap{display:block;padding:18px}header,.panel,footer{margin-bottom:16px}h1{font-size:26px}#clock{font-size:22px}h2{font-size:24px}.news,.condition{font-size:19px}.story small,.status{font-size:12px}.temp{font-size:55px}.details,.sub{font-size:16px}.ad{font-size:23px}.tag{font-size:16px}}
</style></head><body><div class="wrap"><header><h1>ZUID-OOST <span style="color:white">AUTOMOBIELBEDRIJF</span></h1><div id="clock">--:--</div></header><section class="panel"><h2>📰 Nieuws</h2><div class="news" id="news"><div class="story">Nieuwskoppen worden geladen…</div></div><div class="status" id="newsstatus">Bron: NOS RSS</div></section><section class="panel weather"><h2>🌤️ Het weer in Tilburg</h2><div class="temp" id="temp">--°</div><div class="condition" id="condition">Weerbericht laden…</div><div class="details" id="details"></div><div class="status" id="weatherstatus">Bron: Open-Meteo</div></section><footer><div><div class="ad" id="ad">Welkom bij Zuid-Oost Automobielbedrijf</div><div class="sub" id="sub">Uw auto verdient onze aandacht.</div></div><div class="tag">🚘 ZUID-OOST</div></footer></div><script>
function clock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',hour:'2-digit',minute:'2-digit'}).format(new Date())}clock();setInterval(clock,30000);
const ads=[['Welkom bij Zuid-Oost Automobielbedrijf','Uw auto verdient onze aandacht.'],['Onderhoud en reparatie','Vraag naar de mogelijkheden bij onze medewerkers.'],['Op zoek naar een andere auto?','Informeer naar ons actuele aanbod.'],['Zuid-Oost Automobielbedrijf','Persoonlijke service, ook na aankoop.']];let ai=0;setInterval(()=>{ai=(ai+1)%ads.length;document.getElementById('ad').textContent=ads[ai][0];document.getElementById('sub').textContent=ads[ai][1]},12000);
const conditions={0:'Helder',1:'Overwegend helder',2:'Half bewolkt',3:'Bewolkt',45:'Mist',48:'Mist',51:'Lichte motregen',53:'Motregen',55:'Motregen',61:'Lichte regen',63:'Regen',65:'Zware regen',71:'Lichte sneeuw',73:'Sneeuw',75:'Zware sneeuw',80:'Regenbuien',81:'Regenbuien',82:'Zware buien',95:'Onweer',96:'Onweer',99:'Onweer'};
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=51.5555&longitude=5.0913&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Europe%2FAmsterdam');if(!r.ok)throw Error('Geen weergegevens');const d=(await r.json()).current;document.getElementById('temp').textContent=Math.round(d.temperature_2m)+'°';document.getElementById('condition').textContent=conditions[d.weather_code]||'Actueel weer';document.getElementById('details').textContent='Gevoelstemperatuur '+Math.round(d.apparent_temperature)+'°  •  Wind '+Math.round(d.wind_speed_10m)+' km/u  •  Vochtigheid '+d.relative_humidity_2m+'%';document.getElementById('weatherstatus').textContent='Bijgewerkt: '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})+' • Open-Meteo'}catch(e){document.getElementById('condition').textContent='Weer tijdelijk niet beschikbaar';document.getElementById('weatherstatus').textContent='Controleer internetverbinding'}}weather();setInterval(weather,600000);
async function news(){const target=document.getElementById('news');try{const url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent('https://feeds.nos.nl/nosnieuwsalgemeen');const r=await fetch(url);if(!r.ok)throw Error('Nieuwsbron niet beschikbaar');const d=await r.json();if(d.status!=='ok'||!d.items||!d.items.length)throw Error('Geen nieuws');target.textContent='';d.items.slice(0,5).forEach(item=>{const el=document.createElement('div');el.className='story';el.textContent=item.title;target.appendChild(el)});document.getElementById('newsstatus').textContent='Bron: NOS • Bijgewerkt '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}catch(e){target.textContent='';const el=document.createElement('div');el.className='story';el.textContent='Het actuele nieuws kan momenteel niet worden geladen.';target.appendChild(el);document.getElementById('newsstatus').textContent='Bekijk nieuws op nos.nl • Nieuwsfeed tijdelijk niet beschikbaar'}}news();setInterval(news,900000);
</script></body></html>
